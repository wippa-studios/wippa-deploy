# Production compose file: pulls the prebuilt Wippa image.
# For local development builds, use docker-compose.dev.yml instead.
services:
  app:
    image: ${WIPPA_IMAGE:-ghcr.io/wippa/wippa:latest}
    container_name: wippa-app
    restart: unless-stopped
    ports:
      - '8081:80'
    depends_on:
      - postgres
      - redis
    env_file: .env
    environment:
      - AP_CONTAINER_TYPE=APP
    volumes:
      - ./cache:/usr/src/app/cache
    networks:
      - wippa
  worker:
    image: ${WIPPA_IMAGE:-ghcr.io/wippa/wippa:latest}
    restart: unless-stopped
    depends_on:
      - app
    env_file: .env
    environment:
      - AP_CONTAINER_TYPE=WORKER
    deploy:
      replicas: 1
    volumes:
      - ./cache:/usr/src/app/cache
    networks:
      - wippa
  postgres:
    image: 'pgvector/pgvector:0.8.0-pg14'
    container_name: wippa-db
    restart: unless-stopped
    env_file: .env
    environment:
      - 'POSTGRES_DB=${AP_POSTGRES_DATABASE}'
      - 'POSTGRES_PASSWORD=${AP_POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${AP_POSTGRES_USERNAME}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wippa
  redis:
    image: 'redis:7.0.7'
    container_name: wippa-redis
    restart: unless-stopped
    volumes:
      - 'redis_data:/data'
    networks:
      - wippa
volumes:
  postgres_data:
  redis_data:
networks:
  wippa:
