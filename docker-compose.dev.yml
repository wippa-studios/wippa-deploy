services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: wippa-engine:latest
    container_name: wippa-app
    restart: unless-stopped
    ports:
      - '8081:80'
    depends_on:
      - postgres
      - redis
    env_file: .env
    environment:
      - AP_CONTAINER_TYPE=APP
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./cache:/usr/src/app/cache
    networks:
      - wippa
  worker:
    image: wippa-engine:latest
    restart: unless-stopped
    depends_on:
      - app
    env_file: .env
    environment:
      - AP_CONTAINER_TYPE=WORKER
      - OLLAMA_BASE_URL=http://ollama:11434
    deploy:
      replicas: 1
    volumes:
      - ./cache:/usr/src/app/cache
    networks:
      - wippa
  postgres:
    image: 'pgvector/pgvector:0.8.0-pg14'
    container_name: wippa-db
    restart: unless-stopped
    env_file: .env
    environment:
      - 'POSTGRES_DB=${AP_POSTGRES_DATABASE}'
      - 'POSTGRES_PASSWORD=${AP_POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${AP_POSTGRES_USERNAME}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wippa
  redis:
    image: 'redis:7.0.7'
    container_name: wippa-redis
    restart: unless-stopped
    volumes:
      - 'redis_data:/data'
    networks:
      - wippa
  ollama:
    image: ollama/ollama:latest
    container_name: wippa-ollama
    restart: unless-stopped
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - wippa
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    entrypoint: >
      sh -c "
      ollama serve &
      sleep 3 &&
      ollama pull gemma3:1b &&
      echo 'Ollama ready with gemma3:1b' &&
      wait
      "
volumes:
  postgres_data:
  redis_data:
  ollama_data:
networks:
  wippa:
